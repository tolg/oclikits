[package]
name = "oclikits"
version = "0.1.0"
edition = "2021"
authors = ["dongchao"]
description = "OpenCode CLI Kits in Rust"

[[bin]]
name = "oc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "signal",
    "sync",
    "time",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
colored = "2.1"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

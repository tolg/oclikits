[package]
name = "aid"
version = "0.1.0"
edition = "2021"
authors = ["dongchao"]
description = "AI CLI Kits in Rust"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
colored = "2.1"
indicatif = "0.17"
crossterm = "0.28"
futures-util = "0.3"
eventsource-stream = "0.2"
thiserror = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
